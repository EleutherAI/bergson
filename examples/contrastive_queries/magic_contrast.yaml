# MAGIC scores with a contrastive query: the mean loss on the power-seeking
# answers minus the mean loss on the other answers to the same questions.

# Run with `bergson examples/contrastive_queries/magic_contrast.yaml`

run_path: runs/contrastive_queries/power_seeking
steps:
  - magic:
      run_path: runs/contrastive_queries/power_seeking
      model: Qwen/Qwen2.5-1.5B-Instruct
      resume: true

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        data:
          dataset: queries/power_seeking.jsonl
          format_template: examples/contrastive_queries/formats/question_answer.yaml
        contrast:
          dataset: queries/power_seeking_control.jsonl
          format_template: examples/contrastive_queries/formats/question_answer.yaml
        aggregation: mean

      distributed:
        nproc_per_node: 8
        nnode: 1

      batch_size: 64
      grad_accum_steps: 2
      double_backward_batch_size: 2
      num_epochs: 1
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.00002
        lr_start: 1e-7
        lr_end: 0.000002
        warmup_steps: 0.1
      adam_beta1: 0.9
      adam_beta2: 0.999
      eps_root: 1.0e-17
      skip_validation: true
