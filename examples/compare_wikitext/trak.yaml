# TRAK (Park et al. 2023) scores for the 1_magic.yaml model against the test
# queries: one global random projection of the gradient, damped inverse Gram,
# (1 - p_i) weighting, single checkpoint.
# LDS: examples/compare_wikitext/lds_from_bank.py --sign grad.

# Run with `bergson examples/compare_wikitext/trak.yaml`

run_path: runs/compare_wikitext/trak
steps:
  - trak:
      index_cfg:
        projection_dim: 4096
        # One Rademacher sketch of the whole gradient.
        projection_target: global
        run_path: runs/compare_wikitext/trak
        model: runs/compare_wikitext/interval/exported/checkpoint-72
        overwrite: true
        token_batch_size: 1024
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 4
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      trak_cfg:
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        preprocess_cfg:
          aggregation: none
          inversion_cfg:
            damping_factor: 0.1
        score_cfg:
          batch_size: 1024
