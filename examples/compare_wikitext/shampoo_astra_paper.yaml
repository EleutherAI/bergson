# Eigenvalue-corrected Shampoo scores refined by ASTRA for the 1_magic.yaml model against the test
# queries, one score column per query. LDS:
# examples/compare_wikitext/lds_from_bank.py --sign grad.

# Run with `bergson examples/compare_wikitext/shampoo_astra_paper.yaml`

run_path: runs/compare_wikitext/shampoo_astra_paper
steps:
  - ekfac:
      index_cfg:
        run_path: runs/compare_wikitext/shampoo_astra_paper
        model: runs/compare_wikitext/interval/exported/checkpoint-72
        overwrite: true
        # GPT-2's max context length is 1024.
        token_batch_size: 1024
        # Cap batch size in docs so the bin-packer doesn't produce large
        # batches of very few tokens; EK-FAC gradients aren't compressed.
        max_batch_size: 64
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 4
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      hessian_cfg:
        method: shampoo
        ev_correction: true

      score_cfg:
        batch_size: 1024
        query_batch_size: 64

      preprocess_cfg:
        unit_normalize: false

      hessian_pipeline_cfg:
        query:
          data:
            dataset: EleutherAI/bergson-wikitext-512-chunks
            split: "test[0:50]"
            chunk_length: 0
          # One score column per query, for per-query LDS.
          aggregation: none
        inversion_cfg:
          damping_factor: 0.1
        astra:
          # Paper App. B: mean-reduced curvature, 300 iterations, batch 16,
          # momentum 0.9, the step size decayed by 0.9 every 100.
          num_steps: 300
          lr: 0.011
          loss_reduction: mean
          momentum: 0.9
          batch_size: 16
          micro_batch_size: 8
          lr_decay: 0.9
          lr_decay_interval: 100
