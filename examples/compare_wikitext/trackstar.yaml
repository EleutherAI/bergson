# TrackStar scores without optimizer correction for the 1_magic.yaml model
# against the test queries, one step per projection dim.
# LDS: examples/compare_wikitext/lds_from_bank.py --sign grad.

# Run with `bergson examples/compare_wikitext/trackstar.yaml`

run_path: runs/compare_wikitext/trackstar_p16
steps:
  - trackstar: &trackstar
      index_cfg: &index
        projection_dim: 16
        run_path: runs/compare_wikitext/trackstar_p16
        model: runs/compare_wikitext/interval/exported/checkpoint-72
        overwrite: true
        # GPT-2's max context length is 1024
        token_batch_size: 1024
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 4
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      trackstar_cfg:
        stats_sample_size: 10000
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        preprocess_cfg:
          unit_normalize: true
          aggregation: none
        score_cfg:
          batch_size: 1024

  - trackstar:
      <<: *trackstar
      index_cfg:
        <<: *index
        projection_dim: 32
        run_path: runs/compare_wikitext/trackstar_p32

  - trackstar:
      <<: *trackstar
      index_cfg:
        <<: *index
        projection_dim: 64
        run_path: runs/compare_wikitext/trackstar_p64

# Projection 128 is omitted: each module's fp32 Gram is (128*128)^2 floats,
# about 1 GB per module and 48 GB per rank for GPT-2.
