# Compute TrackStar attribution scores for the magic-trained model against
# test[0:50] (one score column per query), then run leave-k-out validation on
# those scores against the retrained models from magic.yaml. No optimizer
# normalization; see trackstar_adam.yaml for the Adam second-moment-normalized
# variant.

# Run with `bergson examples/compare_wikitext/trackstar.yaml`

run_path: runs/compare_wikitext/trackstar
steps:
  - trackstar:
      index_cfg:
        projection_dim: 32
        run_path: runs/compare_wikitext/trackstar
        model: runs/compare_wikitext/random/retrained/base
        overwrite: true
        # GPT-2's max context length is 1024
        token_batch_size: 1024
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 8
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      trackstar_cfg:
        stats_sample_size: 10000
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        preprocess_cfg:
          unit_normalize: true
          aggregation: none
        score_cfg:
          batch_size: 1024

  - validate:
      run_path: runs/compare_wikitext/validate_trackstar_random
      model: gpt2
      overwrite: true

      scores: runs/compare_wikitext/trackstar/scores
      retrained_dir: runs/compare_wikitext/random

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:50]"
        chunk_length: 0

      distributed:
        nproc_per_node: 8
        nnode: 1

      batch_size: 64
