# TRAK scores for ensemble member s0/subset_1 (a GPT-2 trained on a random 50% subset,
# seed 101) against the test queries: one global random projection of the gradient, a
# plain inverse Gram (no regularization, as in the paper) and (1 - p_i) weighting;
# the ensemble score is the mean over members.
# LDS: examples/compare_wikitext/lds_from_bank.py --sign grad.

# Run with `bergson examples/compare_wikitext/trak_ensemble/score_s0_1.yaml`

run_path: runs/compare_wikitext/trak_ens/score_s0_1
steps:
  - trak:
      index_cfg:
        projection_dim: 4096
        # TRAK's features are gradients of the negative log-odds output.
        loss_fn: log_odds
        # One Rademacher sketch of the whole gradient.
        projection_target: global
        run_path: runs/compare_wikitext/trak_ens/score_s0_1
        model: runs/compare_wikitext/trak_ens/s0/retrained/subset_1
        overwrite: false
        token_batch_size: 1024
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 4
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      trak_cfg:
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        preprocess_cfg:
          aggregation: none
          inversion_cfg:
            damping_factor: 0.0
        score_cfg:
          batch_size: 1024
