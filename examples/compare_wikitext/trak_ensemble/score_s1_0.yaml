# TRAK scores for ensemble member s1/subset_0 (a GPT-2 trained on a random 50% subset,
# seed 102) against the test queries: one global random projection of the gradient, a
# plain inverse Gram (no regularization, as in the paper) and (1 - p_i) weighting;
# the ensemble score is the mean over members.
# LDS: examples/compare_wikitext/lds_from_bank.py --sign grad.

# Run with `bergson examples/compare_wikitext/trak_ensemble/score_s1_0.yaml`

run_path: runs/compare_wikitext/trak_ens/score_s1_0
steps:
  - trak:
      index_cfg:
        projection_dim: 4096
        # TRAK's features are gradients of the margin output function.
        loss_fn: margin
        # One Rademacher sketch of the whole gradient.
        projection_target: global
        run_path: runs/compare_wikitext/trak_ens/score_s1_0
        model: runs/compare_wikitext/trak_ens/s1/retrained/subset_0
        overwrite: false
        token_batch_size: 1024
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 4
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      trak_cfg:
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        preprocess_cfg:
          aggregation: none
          inversion_cfg:
            damping_factor: 0.0
        score_cfg:
          batch_size: 1024
