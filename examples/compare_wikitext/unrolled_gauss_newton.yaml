# Unrolled Gauss-Newton scores for the 50 test queries: MAGIC's backward through the 1_magic.yaml trajectory with each
# step's loss Hessian replaced by its Gauss-Newton approximation. Resumes that trajectory (copy
# runs/compare_wikitext/random/checkpoints and optimizer.pt into this run_path first). LDS:
# examples/compare_wikitext/lds_from_bank.py --sign loss.
# Run with `bergson examples/compare_wikitext/unrolled_gauss_newton.yaml`

run_path: runs/compare_wikitext/unrolled_gauss_newton
steps:
  - magic:
      run_path: runs/compare_wikitext/unrolled_gauss_newton
      model: gpt2
      resume: true
      curvature: gauss_newton

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        aggregation: none

      distributed:
        nproc_per_node: 8
        nnode: 1

      batch_size: 256
      grad_accum_steps: 2
      double_backward_batch_size: 16
      num_epochs: 4
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0004
        lr_start: 1e-6
        lr_end: 0.00004
        warmup_steps: 0.25
      adam_beta1: 0.9
      adam_beta2: 0.999
      eps_root: 1.0e-17

      skip_validation: true
      num_subsets: 0
      save_models: false
