# Pipeline: compute EK-FAC scores for the magic-trained model from q3_random
# against test[0:50] (one score column per query), then run leave-k-out
# validation on those scores, with and without zero-score exclusion.

# Run with `bergson examples/magic/compare_wikitext/ekfac.yaml`

run_path: runs/compare_wikitext/ekfac
steps:
  - ekfac:
      index_cfg:
        run_path: runs/compare_wikitext/ekfac
        model: runs/compare_wikitext/random/retrained/base
        overwrite: true
        # GPT-2's max context length is 1024.
        token_batch_size: 1024
        # Cap batch size in docs so the bin-packer doesn't produce
        # large batches of very few tokens. This matters for EK-FAC
        # because gradients aren't compressed.
        max_batch_size: 64
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 8
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      hessian_cfg:
        method: kfac
        ev_correction: true

      score_cfg:
        batch_size: 1024
        query_batch_size: 64

      preprocess_cfg:
        unit_normalize: false

      hessian_pipeline_cfg:
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        # One score column per query, for per-query LDS.
        query_aggregation: none
        inversion_cfg:
          damping_factor: 0.1

  - validate: &validate
      run_path: runs/compare_wikitext/validate_ekfac_random
      model: gpt2
      overwrite: true

      scores: runs/compare_wikitext/ekfac/scores

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:50]"
        chunk_length: 0

      distributed:
        nproc_per_node: 4
        nnode: 4

      batch_size: 256
      num_epochs: 2
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0008
        lr_start: 1e-6
        lr_end: 0.00008
        warmup_steps: 0.25

      wandb_project: magic

  - validate:
      # YAML merge key: copy the contents of &validate
      <<: *validate
      run_path: runs/compare_wikitext/validate_ekfac_random_exclude_0
      exclude_zero_scores: true
