# EK-FAC scores for the magic.yaml model against the test queries, one score
# column per query. LDS: examples/compare_wikitext/lds_from_bank.py --sign grad.

# Run with `bergson examples/compare_wikitext/ekfac.yaml`

run_path: runs/compare_wikitext/ekfac
steps:
  - ekfac:
      index_cfg:
        run_path: runs/compare_wikitext/ekfac
        model: runs/compare_wikitext/interval/exported/checkpoint-72
        overwrite: true
        # GPT-2's max context length is 1024.
        token_batch_size: 1024
        # Cap batch size in docs so the bin-packer doesn't produce large
        # batches of very few tokens; EK-FAC gradients aren't compressed.
        max_batch_size: 64
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 4
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      hessian_cfg:
        method: kfac
        ev_correction: true

      score_cfg:
        batch_size: 1024
        query_batch_size: 64

      preprocess_cfg:
        unit_normalize: false

      hessian_pipeline_cfg:
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        # One score column per query, for per-query LDS.
        query_aggregation: none
        inversion_cfg:
          damping_factor: 0.1
