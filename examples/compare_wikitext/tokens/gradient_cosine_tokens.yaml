# Per-token gradient cosine similarity: forward-mode pass along the normalized query
# direction written by direction_store.py; combine_tokens.py rescale restores each
# chunk's inverse gradient norm.
# Run with `bergson examples/compare_wikitext/tokens/gradient_cosine_tokens.yaml`

run_path: runs/compare_wikitext/tokens/gradient_cosine_tokens
steps:
  - score:
      index_cfg:
        run_path: runs/compare_wikitext/tokens/gradient_cosine_pass
        model: runs/compare_wikitext/interval/exported/checkpoint-72
        overwrite: false
        token_batch_size: 1024
        max_batch_size: 64
        filter_modules: "lm_head"
        attribute_tokens: true
        distributed:
          nproc_per_node: 8
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0
      score_cfg:
        query_path: runs/compare_wikitext/tokens/gradient_cosine_direction
        token_influence: output
        batch_size: 1024
        query_batch_size: 64
      preprocess_cfg:
        unit_normalize: false
