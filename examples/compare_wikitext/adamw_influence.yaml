# AdamW-influence (Deng et al. 2026): every parameter unrolled with the mean outer product of the documents' gradients as curvature scores for the 50 test queries, replaying the 1_magic.yaml trajectory (copy
# runs/compare_wikitext/random/checkpoints and optimizer.pt into this run_path first). LDS:
# examples/compare_wikitext/lds_from_bank.py --sign loss.
# Run with `bergson examples/compare_wikitext/adamw_influence.yaml`

run_path: runs/compare_wikitext/adamw_influence
steps:
  - magic:
      run_path: runs/compare_wikitext/adamw_influence
      model: gpt2
      resume: true
      unroll:
        enabled: true
        curvature: gradient_outer
        parameters: all

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
        aggregation: none

      distributed:
        nproc_per_node: 8
        nnode: 1

      batch_size: 256
      grad_accum_steps: 2
      num_epochs: 4
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0004
        lr_start: 1e-6
        lr_end: 0.00004
        warmup_steps: 0.25
      adam_beta1: 0.9
      adam_beta2: 0.999
      eps_root: 1.0e-17

      skip_validation: true
      num_subsets: 0
      save_models: false
