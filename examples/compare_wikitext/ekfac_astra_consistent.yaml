# EK-FAC scores refined by ASTRA with the paper's settings and Hessian-vector
# products of the same loss as the EK-FAC factors, for the 1_magic.yaml model
# against the test queries, one score column per query. The step size has the
# lowest mean final / |step-0| objective, on each query's last 16-document batch,
# over the held-out queries test[50:60], from 1e-3 to 1e-7; 1e-5 and above diverge.
# LDS: examples/compare_wikitext/lds_from_bank.py --sign grad.

# Run with `bergson examples/compare_wikitext/ekfac_astra_consistent.yaml`

run_path: runs/compare_wikitext/ekfac_astra_consistent
steps:
  - ekfac:
      index_cfg:
        run_path: runs/compare_wikitext/ekfac_astra_consistent
        model: runs/compare_wikitext/interval/exported/checkpoint-72
        overwrite: true
        # GPT-2's max context length is 1024.
        token_batch_size: 1024
        # Cap batch size in docs so the bin-packer doesn't produce large
        # batches of very few tokens; EK-FAC gradients aren't compressed.
        max_batch_size: 64
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 8
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      hessian_cfg:
        method: kfac
        ev_correction: true

      score_cfg:
        batch_size: 1024
        query_batch_size: 64

      preprocess_cfg:
        unit_normalize: false

      hessian_pipeline_cfg:
        query:
          data:
            dataset: EleutherAI/bergson-wikitext-512-chunks
            split: "test[0:50]"
            chunk_length: 0
          # One score column per query, for per-query LDS.
          aggregation: none
        inversion_cfg:
          damping_factor: 0.1
        astra:
          num_steps: 300
          lr: 3.0e-6
          momentum: 0.9
          batch_size: 16
          micro_batch_size: 8
          lr_decay: 0.9
          lr_decay_interval: 100
