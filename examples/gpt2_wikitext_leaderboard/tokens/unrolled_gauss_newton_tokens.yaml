# Per-token unrolled Gauss-Newton scores for the 50 test queries over the
# 1_magic.yaml run's checkpoints: every training token, one row per chunk with
# the epochs summed. QLD: filter_unrolled_gauss_newton_tokens.yaml.
# Run with `bergson examples/gpt2_wikitext_leaderboard/tokens/unrolled_gauss_newton_tokens.yaml`

run_path: runs/compare_wikitext/tokens/unrolled_gauss_newton_tokens
steps:
  - gnh-unroll:
      run_path: runs/compare_wikitext/tokens/unrolled_gauss_newton_tokens
      checkpoints: runs/compare_wikitext/random/checkpoints
      model: gpt2
      attribute_tokens: true

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:50]"
        chunk_length: 0
        aggregation: none

      distributed:
        nproc_per_node: 8
        nnode: 1

      use_tf32_matmuls: true
      batch_size: 256
      grad_accum_steps: 2
      double_backward_batch_size: 4
      num_epochs: 4
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0004
        lr_start: 1e-6
        lr_end: 0.00004
        warmup_steps: 0.25
      adam_beta1: 0.9
      adam_beta2: 0.999
      eps_root: 1.0e-17
