# Proponent-filter for EKFAC + ASTRA. Uses the random retrain bank
# computed with `examples/gpt2_wikitext_leaderboard/1_magic.yaml`.

# Run with `bergson examples/gpt2_wikitext_leaderboard/filters/filter_ekfac_astra.yaml`

run_path: runs/compare_wikitext/filter_ekfac_astra
steps:
  - validate:
      run_path: runs/compare_wikitext/filter_ekfac_astra
      model: gpt2
      resume: true
      seed: 42

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:15]+test[16:44]+test[45:50]"
        chunk_length: 0
        aggregation: none

      distributed:
        nproc_per_node: 8
        nnode: 1

      batch_size: 256
      grad_accum_steps: 2
      num_epochs: 4
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0004
        lr_start: 1e-6
        lr_end: 0.00004
        warmup_steps: 0.25
      adam_beta1: 0.9
      adam_beta2: 0.999
      eps_root: 1.0e-17

      method:
        kind: filter
        direction: proponents
        fraction: 0.01
        controls:
          kind: bank
          paths: [runs/compare_wikitext/random]
          count: null
      scores: runs/compare_wikitext/ekfac_astra/scores
  # Queries 15 and 44 diverge at lr 3e-6, so they run at the next grid step size.
  - validate:
      run_path: runs/compare_wikitext/filter_ekfac_astra_lr1e-6
      model: gpt2
      resume: true
      seed: 42

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[15:16]+test[44:45]"
        chunk_length: 0
        aggregation: none

      distributed:
        nproc_per_node: 8
        nnode: 1

      batch_size: 256
      grad_accum_steps: 2
      num_epochs: 4
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0004
        lr_start: 1e-6
        lr_end: 0.00004
        warmup_steps: 0.25
      adam_beta1: 0.9
      adam_beta2: 0.999
      eps_root: 1.0e-17

      method:
        kind: filter
        direction: proponents
        fraction: 0.01
        controls:
          kind: bank
          paths: [runs/compare_wikitext/random]
          count: null
      scores: runs/compare_wikitext/ekfac_astra_lr1e-6/scores
