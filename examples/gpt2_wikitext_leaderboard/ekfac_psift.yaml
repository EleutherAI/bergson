# EKFAC (P-SIFT, SRHT projection 131072) scores for the 1_magic.yaml model against the test queries, one score
# column per query (P-SIFT): H^-1/2 is applied to both the training and query
# gradients, which are each sketched by a subsampled randomized Hadamard transform per
# module, summed into one 131072-entry vector, and scored by their dot product.
# Same factors and damping as ekfac.yaml. LDS: examples/gpt2_wikitext_leaderboard/lds_from_bank.py --sign grad.

# Run with `bergson examples/gpt2_wikitext_leaderboard/ekfac_psift.yaml`

run_path: runs/compare_wikitext/ekfac_psift
steps:
  - influence:
      index_cfg:
        run_path: runs/compare_wikitext/ekfac_psift
        model: runs/compare_wikitext/interval/exported/checkpoint-72
        overwrite: true
        projection_dim: 131072
        projection_type: hadamard
        projection_target: global
        # GPT-2's max context length is 1024.
        token_batch_size: 1024
        # Cap batch size in docs so the bin-packer doesn't produce large
        # batches of very few tokens.
        max_batch_size: 64
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 4
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      hessian_cfg:
        method: kfac
        ev_correction: true

      score_cfg:
        batch_size: 1024
        query_batch_size: 64

      preprocess_cfg:
        unit_normalize: false

      hessian_pipeline_cfg:
        precondition_index: true
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
          # One score column per query, for per-query LDS.
          aggregation: none
        inversion_cfg:
          damping_factor: 0.1
