# LiSSA influence (Bae et al. 2022, https://arxiv.org/abs/2209.05364) for the
# 1_magic.yaml model against the test queries, one score column per query:
# the damped Gauss-Newton Hessian inverse applied to each query gradient by
# LiSSA. LDS: examples/gpt2_wikitext_leaderboard/lds_from_bank.py --sign grad.

# Run with `bergson examples/gpt2_wikitext_leaderboard/lissa.yaml`

run_path: runs/compare_wikitext/lissa
steps:
  - lissa:
      index_cfg:
        run_path: runs/compare_wikitext/lissa
        model: runs/compare_wikitext/interval/exported/checkpoint-72
        overwrite: true
        # GPT-2's max context length is 1024.
        token_batch_size: 1024
        max_batch_size: 64
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        # The paper's training loss averages each document's token losses.
        loss_reduction: mean
        distributed:
          nproc_per_node: 8
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          chunk_length: 0

      score_cfg:
        batch_size: 1024
        query_batch_size: 64

      preprocess_cfg:
        unit_normalize: false

      lissa_cfg:
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:50]"
          chunk_length: 0
          # One score column per query, for per-query LDS.
          aggregation: none
        # The paper's Transformer settings; scale is the smallest value in its
        # tuning grid (10 to 500) that does not diverge here.
        damping: 0.01
        scale: 50
        depth: 5000
        repeats: 5
        batch_size: 8
        micro_batch_size: 8
