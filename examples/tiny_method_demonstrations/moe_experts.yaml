# Per-expert attribution for an MoE model with fused expert parameters.
#
# `moe_experts` names the layers that keep all of their experts in one 3D
# nn.Parameter, giving each expert projection its own module in the index.
#
# The model is a 2-layer, 4-expert, top-2 gpt-oss with random weights, so the
# scores are noise. The same pattern applies to openai/gpt-oss-20b.
#
# Run with `bergson examples/moe_experts.yaml`
#
# Confirm the experts are tracked. Each gate_up_proj is [2*32, 8] = 512 and each
# down_proj [8, 32] = 256, which covers every weight in the fused parameters:
#
#   python -c "
#   import json
#   sizes = json.load(open('runs/moe_experts/index/info.json'))['grad_sizes']
#   experts = {k: v for k, v in sizes.items() if '.experts.expert_' in k}
#   print(len(experts), 'expert projections'); print(experts)
#   "

run_path: runs/moe_experts
steps:
  # Step 1/2: build the gradient index that doubles as the query set.
  - build:
      index_cfg:
        run_path: runs/moe_experts/index
        model: trl-internal-testing/tiny-GptOssForCausalLM
        overwrite: true
        moe_experts: "model.layers.*.mlp.experts"
        # Store raw gradients, so grad_sizes reports each expert's weight count.
        projection_dim: 0
        # This model's 201088 x 8 embedding matrix would dwarf every other
        # module in the index.
        filter_modules: "lm_head"
        token_batch_size: 2048
        data:
          dataset: NeelNanda/pile-10k
          split: "train[:256]"
          truncation: true
        distributed:
          nproc_per_node: 1
      preprocess_cfg: {}

  # Step 2/2: score the same dataset against that index, so entry (i, j) is
  # the gradient inner product <g_i, g_j>. See examples/self_influence.yaml.
  - score:
      score_cfg:
        query_path: runs/moe_experts/index
        batch_size: 256

      index_cfg:
        run_path: runs/moe_experts/scores
        model: trl-internal-testing/tiny-GptOssForCausalLM
        overwrite: true
        moe_experts: "model.layers.*.mlp.experts"
        projection_dim: 0
        filter_modules: "lm_head"
        token_batch_size: 2048
        data:
          dataset: NeelNanda/pile-10k
          split: "train[:256]"
          truncation: true
        distributed:
          nproc_per_node: 1
      preprocess_cfg: {}
