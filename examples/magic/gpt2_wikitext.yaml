# Replication of the GPT-2/WikiText experiment from MAGIC (arXiv 2504.16430,
# App. A).

# Hyperparameters are inferred from the MAGIC paper, the metagradients
# paper it cites, and the datacomp competition that the metagradients paper cites.
# The original batch size was lost.

# Run with `bergson examples/magic/gpt2_wikitext.yaml`

steps:
  - magic:
      run_path: runs/gpt2_wikitext
      model: gpt2
      overwrite: true
      cleanup_ckpts: false
      weight_decay: 0.01
      adam_eps: 1.0e-8
      # Chosen experimentally
      eps_root: 1.0e-6
      # The metagradients paper documents sum_of_means for Gemma-IFT, but the
      # MAGIC paper's Fig. 5 GPT-2 panel shows 1%-drop retrains moving true
      # loss by only ~0.006 — matching our mean-reduction banks (0.007-0.009)
      # and excluding sum_of_means (0.2, nearly batch-size-invariant).
      loss_reduction: mean

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:1]"
        chunk_length: 0

      distributed:
        nproc_per_node: 8
        nnode: 1

      # Original batch size lost
      batch_size: 64
      num_epochs: 4
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0008
        lr_start: 1e-6
        lr_end: 0.00008
        warmup_steps: 0.25

      wandb_project: magic
      save_optimizer_state: True
      save_models: True
