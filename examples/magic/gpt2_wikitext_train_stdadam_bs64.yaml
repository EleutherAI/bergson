steps:
- train:
    run_path: runs/gpt2_wikitext_stdadam_bs64
    overwrite: true
    model: gpt2
    precision: fp32
    revision: null
    distributed:
      nnode: 1
      nproc_per_node: 8
      node_rank: null
    fsdp: false
    peft_init_kwargs: ''
    model_kwargs: ''
    data:
      dataset: EleutherAI/bergson-wikitext-512-chunks
      split: train
      subset: null
      prompt_column: text
      completion_column: ''
      conversation_column: ''
      reward_column: ''
      skip_nan_rewards: false
      truncation: false
      format_template: ''
      data_kwargs: ''
      chunk_length: 0
    tokenizer: ''
    drop_columns: true
    max_tokens: null
    use_tf32_matmuls: false
    debug: false
    lr_schedule:
      lr: 0.0008
      lr_scheduler_type: polynomial
      lr_start: 1.0e-06
      lr_end: 8.0e-05
      warmup_steps: 0.25
      num_cycles: 0.5
      power: 1.0
    batch_size: 64
    num_epochs: 4
    seed: 42
    adam_beta1: 0.9
    adam_beta2: 0.999
    eps_root: 0.0
    optimizer: adamw
    save_optimizer_state: true
    save_retrained_models: true
    weight_decay: 0.01
    max_grad_norm: null
    grad_checkpointing: false
    resume: false
    wandb_project: magic
