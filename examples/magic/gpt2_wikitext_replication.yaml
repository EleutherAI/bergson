# Replication of the GPT-2/WikiText experiment from MAGIC (arXiv 2504.16430,
# App. A).

# Hyperparameters are inferred from the MAGIC paper, the metagradients
# paper it cites, and the datacomp competition that the metagradients paper cites.
# Original batch size and loss reduction were lost and re-selected empirically.

# Per-query MAGIC LDS = 0.952 (95% CI [0.944, 0.959]), measured over m=50
# queries against an N=100 leave-1%-out retrain bank.

# Run with `bergson examples/magic/gpt2_wikitext.yaml`

steps:
  - magic:
      run_path: runs/gpt2_wikitext_replication
      model: gpt2
      overwrite: true
      cleanup_ckpts: false
      weight_decay: 0.01
      adam_eps: 1.0e-8
      adam_beta1: 0.95
      adam_beta2: 0.975
      eps_root: 1.0e-8
      loss_reduction: mean

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:1]"
        chunk_length: 0

      distributed:
        nproc_per_node: 8
        nnode: 1

      batch_size: 256
      grad_accum_steps: 2
      num_epochs: 4
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0008
        lr_start: 1e-6
        lr_end: 0.00008
        warmup_steps: 0.25

      skip_validation: false
      num_subsets: 100
      subset_fraction: 0.01

      wandb_project: magic
      save_optimizer_state: last
      save_models: True
