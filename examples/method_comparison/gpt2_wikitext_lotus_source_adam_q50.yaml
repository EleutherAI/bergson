# Adam/AdamW SOURCE variant (Bae et al., 2024, Appendix C) for the lotus
# GPT-2 base model against the 50 test queries, validated against the
# complete 400-model lotus bank. The unrolling eigenfunctions are evaluated
# on a diagonal approximation of P^1/2 H P^1/2, where P is the per-segment
# diagonal Adam preconditioner built from each checkpoint dir's
# optimizer.pt (written per snapshot during training by
# TrainingConfig.save_optimizer_state and copied in at checkpoint export).
#
# Reuses the lotus_source_q50 run's query gradients and segment KFAC/lambda
# artifacts via symlinks; only the eigenfunction application (steps 6-7) and
# scoring (step 8) recompute. Same 6-checkpoint/3-segment recipe and lr_list.
#
# Validated LDS at N=400: mean Spearman rho=0.207 across the 50 queries --
# weaker than the SGD variant's 0.390 on the same bank, suggesting the
# paper's diagonal-Hessian approximation costs more here than the
# optimizer-correct preconditioning gains.

# Run with `bergson examples/method_comparison/gpt2_wikitext_lotus_source_adam_q50.yaml`

steps:
  - approxunrolling:
      index_cfg:
        run_path: runs/lotus_source_adam_q50
        # Tokenizer + final-model reference; per-checkpoint passes load the
        # model dirs below.
        model: runs/lotus/retrained/base
        # In the approxunrolling pipeline `overwrite` doubles as resume:
        # steps whose output dirs exist are skipped after a crash.
        overwrite: true
        precision: fp32
        # GPT-2's max context length is 1024.
        token_batch_size: 1024
        # GPT-2 uses an nn.Linear for its LM head.
        filter_modules: "lm_head"
        distributed:
          nproc_per_node: 8   # <-- adjust to this node's GPU count
          nnode: 1
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          # Doc-level scoring (one doc per row, no packing): packed 512-token
          # chunks contaminate per-doc gradients across doc boundaries and
          # were found to suppress LDS (see gpt2_lotus_trackstar50q_docs).
          chunk_length: 0

      hessian_cfg:
        method: kfac
        hessian_dtype: fp32
        ev_correction: true

      approx_unrolling_cfg:
        checkpoints:
          - runs/lotus_source_q50/models/step_51
          - runs/lotus_source_q50/models/step_102
          - runs/lotus_source_q50/models/step_136
          - runs/lotus_source_q50/models/step_187
          - runs/lotus_source_q50/models/step_238
          - runs/lotus_source_q50/models/step_288
        segments: 3
        lr_list: [4.857423e-04, 5.616667e-04, 2.416667e-04]
        step_size_list: [97, 96, 96]
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[1:51]"
          chunk_length: 0
        # One score column per query (50 total), like the EK-FAC and
        # TrackStar runs, for multi-query LDS validation.
        query_aggregation: none
        # Adam variant: build per-segment diagonal preconditioners from the
        # checkpoints' optimizer.pt files.
        use_adam_preconditioner: true

  - validate:
      run_path: runs/lotus_source_adam_q50_validate
      model: gpt2
      overwrite: true

      scores: runs/lotus_source_adam_q50/scores
      retrained_dir: runs/lotus

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 512

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[1:51]"
        chunk_length: 0

      batch_size: 64
