# EKFAC-SOURCE and ASTRA-SOURCE (Wang et al. 2025, Fig. 2, WikiText-2 / GPT-2)
# on the training run, MLP layers only and 100 random validation queries
# (prep_queries.py) as in the paper, then LDS against the retrained models.
# Runs after the SOURCE step, which exports the checkpoints.
#
# Each segment's damping 1 / (lr K) is the paper's 0.011, the average SOURCE
# damping it reports, with the preconditioner damped the same and the ASTRA
# step size equal to it (App. F, Table 3).
#
#   PYTHONPATH=$PWD python -m bergson examples/replications/bae_approx_unrolling_source_replication/wikitext_gpt2_astra_source.yaml

steps:
- approxunrolling: &source
    index_cfg:
      run_path: runs/wikitext_repro/ekfac_source_mlp_scores
      model: runs/wikitext_repro/train/exported/checkpoint-1746
      overwrite: true
      precision: fp32
      token_batch_size: 1024
      max_batch_size: 64
      filter_modules: "lm_head,*attn*"
      distributed:
        nproc_per_node: 8
        nnode: 1
      data:
        dataset: EleutherAI/bergson-wikitext-2-4656-chunks
        split: train
        chunk_length: 0

    hessian_cfg:
      method: kfac
      hessian_dtype: fp32
      ev_correction: true

    approx_unrolling_cfg: &unrolling
      checkpoints:
        - runs/wikitext_repro/train/checkpoints/step_291.ckpt
        - runs/wikitext_repro/train/checkpoints/step_582.ckpt
        - runs/wikitext_repro/train/checkpoints/step_873.ckpt
        - runs/wikitext_repro/train/checkpoints/step_1164.ckpt
        - runs/wikitext_repro/train/checkpoints/step_1455.ckpt
        - runs/wikitext_repro/train/checkpoints/step_1746.ckpt
      segments: 3
      # 1 / (0.011 * 582)
      lr_list: [0.1562011871290222, 0.1562011871290222, 0.1562011871290222]
      step_size_list: [582, 582, 582]
      momentum: 0.0
      query:
        dataset: runs/wikitext_repro/queries
        split: validation
        chunk_length: 0
        aggregation: none
      query_batch_size: 64

- approxunrolling:
    <<: *source
    index_cfg:
      run_path: runs/wikitext_repro/astra_source_mlp_scores
      model: runs/wikitext_repro/train/exported/checkpoint-1746
      overwrite: true
      precision: fp32
      token_batch_size: 1024
      max_batch_size: 64
      filter_modules: "lm_head,*attn*"
      distributed:
        nproc_per_node: 8
        nnode: 1
      data:
        dataset: EleutherAI/bergson-wikitext-2-4656-chunks
        split: train
        chunk_length: 0
    approx_unrolling_cfg:
      <<: *unrolling
      # Paper App. F: 300 iterations, batch size 8, momentum 0.9, learning
      # rate decayed by 0.9 every 100 iterations.
      astra:
        num_steps: 300
        loss_reduction: mean
        lr: 1.0
        momentum: 0.9
        batch_size: 8
        lr_decay: 0.9
        lr_decay_interval: 100

- validate:
    run_path: runs/wikitext_repro/validate_ekfac_source_mlp
    model: gpt2
    overwrite: true
    scores: runs/wikitext_repro/ekfac_source_mlp_scores/scores
    method: &lds
      kind: lds
      subsets: bank
      paths:
      - runs/wikitext_repro/retrain_seed1004
      - runs/wikitext_repro/retrain_seed1005
      - runs/wikitext_repro/retrain_seed1006
      - runs/wikitext_repro/retrain_seed1007
      - runs/wikitext_repro/retrain_seed1008
    batch_size: 64
    data: &data
      dataset: EleutherAI/bergson-wikitext-2-4656-chunks
      split: train
      chunk_length: 0
    query: &query
      dataset: runs/wikitext_repro/queries
      split: validation
      chunk_length: 0
- validate:
    run_path: runs/wikitext_repro/validate_astra_source_mlp
    model: gpt2
    overwrite: true
    scores: runs/wikitext_repro/astra_source_mlp_scores/scores
    method: *lds
    batch_size: 64
    data: *data
    query: *query
