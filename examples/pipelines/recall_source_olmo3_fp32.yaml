# SOURCE (approximate unrolling, Bae et al.) recall for the LoRA-finetuned
# Olmo-3-7B on the synthetic factual-recall data, in fp32, to compare against
# the fp32 EK-FAC and TrackStar runs at the same 100-person scale:
#     runs/recall_ekfac_olmo3_100p_fp32/eval/summary.csv
#     runs/recall_trackstar_olmo3_100p_fp32_1gpu/eval/summary.csv
#
# 6 checkpoints / 3 segments over the 10125-step finetune
# (runs/finetune_recall_9000_olmo3: cosine LR peak 2e-4, 3% warmup, batch 128,
# 4 epochs). Checkpoints are HF adapter dirs exported from the trainer's DCP
# snapshots at steps {1700, 3400 | 5100, 6800 | 8400, 10124} — segment
# midpoints and ends for boundaries 0-3375-6750-10125:
#     python scripts/export_dcp_checkpoints_to_hf.py \
#         --ckpt_dir runs/finetune_recall_9000_olmo3/checkpoints \
#         --base_model allenai/Olmo-3-7B-Instruct \
#         --peft_init_kwargs "r=16,lora_alpha=32,lora_dropout=0.0,target_modules=all-linear,task_type=CAUSAL_LM" \
#         --steps 1700 3400 5100 6800 8400 10124 \
#         --out_dir runs/recall_source_olmo3_100p_fp32/models
#
# lr_list is the per-third average of the training cosine schedule
# (LRScheduleConfig.get_schedule over 10125 steps); it cannot be inferred
# automatically because the MAGIC trainer writes no log_history.json.
#
# Disk: per-checkpoint covariances are ~66GB and segment eigenvectors ~66GB in
# fp32; expect a ~600GB peak. The per-ckpt covariance shards can be deleted
# once their segment's eigendecomposition (pipeline step 2/8) is done.
#
# Run with `python -m bergson examples/pipelines/recall_source_olmo3_fp32.yaml`,
# then:
#   cat runs/recall_source_olmo3_100p_fp32/eval/summary.csv

run_path: runs/recall_source_olmo3_100p_fp32
steps:
  - approxunrolling:
      index_cfg:
        run_path: runs/recall_source_olmo3_100p_fp32
        # Tokenizer + final-model reference; per-checkpoint passes load the
        # adapter dirs below.
        model: EleutherAI/Olmo-3-7B-Instruct-recall-9000
        # In the approxunrolling pipeline `overwrite` doubles as resume:
        # steps whose output dirs exist are skipped after a crash.
        overwrite: true
        precision: fp32
        force_math_sdp: true
        # fp32 memory ceiling on 48GB A40s, matching the EK-FAC fp32 run.
        token_batch_size: 256
        data:
          dataset: data/statements_100p_seed0.hf
          prompt_column: fact
      hessian_cfg:
        method: kfac
        hessian_dtype: fp32
        ev_correction: true
      approx_unrolling_cfg:
        checkpoints:
          - runs/recall_source_olmo3_100p_fp32/models/step_1700
          - runs/recall_source_olmo3_100p_fp32/models/step_3400
          - runs/recall_source_olmo3_100p_fp32/models/step_5100
          - runs/recall_source_olmo3_100p_fp32/models/step_6800
          - runs/recall_source_olmo3_100p_fp32/models/step_8400
          - runs/recall_source_olmo3_100p_fp32/models/step_10124
        segments: 3
        lr_list: [1.770244e-04, 1.046429e-04, 1.833268e-05]
        step_size_list: [3375, 3375, 3375]
        query:
          dataset: data/questions_100p_seed0.hf
          prompt_column: text
        # One score column per question, like the EK-FAC/TrackStar runs.
        query_aggregation: none
        # The 400 unaggregated fp32 query gradients (~60GB) cannot sit on a
        # 48GB card next to the model during per-segment scoring.
        query_batch_size: 64

  - recall:
      run_path: runs/recall_source_olmo3_100p_fp32/eval
      scores: runs/recall_source_olmo3_100p_fp32/scores
      k: 10
      data:
        num_people: 100
        seed: 0
