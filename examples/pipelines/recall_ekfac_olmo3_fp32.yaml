# EK-FAC recall for the LoRA-finetuned Olmo-3-7B on the synthetic
# factual-recall data, in fp32.
#
# Identical to recall_ekfac_olmo3.yaml except precision is fp32 (the model is
# loaded and gradients are collected in fp32 rather than bf16) and the run
# path has an _fp32 suffix. Compare against the fp32 TrackStar run at
#     runs/recall_trackstar_olmo3_100p_fp32_1gpu/eval/summary.csv
# produced by recall_trackstar_olmo3_fp32.yaml.
#
# Prerequisites are the same as recall_ekfac_olmo3.yaml: a healthy multi-GPU
# node and the 100-person recall datasets:
#   python -m bergson.recall.generate --num_people 100 --seed 0 --data_dir data
#
# Run with `python -m bergson examples/pipelines/recall_ekfac_olmo3_fp32.yaml`,
# then:
#   cat runs/recall_ekfac_olmo3_100p_fp32/eval/summary.csv

run_path: runs/recall_ekfac_olmo3_100p_fp32
steps:
  - ekfac:
      index_cfg:
        run_path: runs/recall_ekfac_olmo3_100p_fp32/ekfac
        model: EleutherAI/Olmo-3-7B-Instruct-recall-9000
        precision: fp32
        overwrite: true
        force_math_sdp: true
        # Down from the 2048 default: in fp32 the 48GB A40s OOM during
        # gradient collection at 2048, during the KFAC fit at 1024, and during
        # scoring at 512 (per-sequence gradients for a batch are
        # batch_size x 40M params fp32 next to the model + query slice).
        token_batch_size: 256
        data:
          dataset: data/statements_100p_seed0.hf
          prompt_column: fact
      hessian_cfg:
        method: kfac
        ev_correction: true
      score_cfg:
        batch_size: 1024
        # Score 64 queries per pass: the full 400-query set of unprojected
        # fp32 gradients (~64GB) cannot sit on a 48GB card next to the model.
        query_batch_size: 64
      preprocess_cfg: {}
      hessian_pipeline_cfg:
        # Skip pipeline steps whose output dir already exists (query gradients
        # and KFAC factors survive a crash in a later step).
        resume: true
        query:
          dataset: data/questions_100p_seed0.hf
          prompt_column: text
        query_aggregation: none
        inversion_cfg:
          inversion: damped_inverse
          damping_factor: 0.1

  - recall:
      run_path: runs/recall_ekfac_olmo3_100p_fp32/eval
      scores: runs/recall_ekfac_olmo3_100p_fp32/ekfac/scores
      k: 10
      data:
        num_people: 100
        seed: 0
