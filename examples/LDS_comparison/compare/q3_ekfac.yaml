# EK-FAC (Adam) — README Functionality table row "EK-FAC / Adam".
#
# Scores the Adam-trained model from q3_magic.yaml with the EK-FAC influence
# pipeline, then evaluates LDS against the retrain bank saved by q3_magic.yaml
# (no retraining happens here). Requires q3_magic.yaml to have been run with
# save_retrained_models: true.
#
# Run with `bergson examples/LDS_comparison/compare/q3_ekfac.yaml`

run_path: runs/compare/q3_ekfac
steps:
  - ekfac:
      index_cfg:
        run_path: runs/compare/q3_ekfac
        # Final Adam-trained model banked by q3_magic.yaml.
        model: runs/compare/q3_random/retrained/base
        overwrite: true
        # GPT-2's max context length is 1024.
        token_batch_size: 1024
        # Cap batch size in docs so the bin-packer doesn't produce
        # large batches of very few tokens. This matters for EK-FAC
        # because gradients aren't compressed.
        max_batch_size: 64
        distributed:
          nproc_per_node: 4
          nnode: 4
        data:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "train"
          truncation: true

      hessian_cfg:
        method: kfac
        ev_correction: true

      score_cfg:
        batch_size: 1024

      preprocess_cfg:
        unit_normalize: false

      hessian_pipeline_cfg:
        query:
          dataset: EleutherAI/bergson-wikitext-512-chunks
          split: "test[0:1]"
          chunk_length: 0
        inversion_cfg:
          damping_factor: 0.1

  - validate:
      run_path: runs/compare/q3_validate_ekfac
      model: gpt2
      overwrite: true

      scores: runs/compare/q3_ekfac/scores
      # Re-use the leave-k-out models banked by q3_magic.yaml.
      retrained_dir: runs/compare/q3_random

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 512

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:1]"
        chunk_length: 0

      distributed:
        nproc_per_node: 4
        nnode: 4

      batch_size: 256
