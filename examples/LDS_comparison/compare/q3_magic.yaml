# MAGIC (Adam) — README Functionality table row "MAGIC / Adam".
#
# Trains GPT-2 with Adam, computes MAGIC attribution scores, and runs
# leave-k-out validation in-process (LDS with random subsets).
#
# save_retrained_models banks every leave-k-out retrained model under
# runs/compare/q3_random/retrained/ (plus subsets.json and the final trained
# model at retrained/base). The other Adam-row configs (q3_ekfac.yaml,
# q3_source.yaml) re-use this bank via `retrained_dir`, so their validation
# needs no retraining. Run this config first.
#
# Run with `bergson examples/LDS_comparison/compare/q3_magic.yaml`

run_path: runs/compare/q3_magic
steps:
  - magic:
      run_path: runs/compare/q3_random
      model: gpt2
      overwrite: true
      save_retrained_models: true

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 512

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:1]"
        chunk_length: 0

      distributed:
        nproc_per_node: 4
        nnode: 4

      batch_size: 256
      num_epochs: 2
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.0008
        lr_start: 1e-6
        lr_end: 0.00008
        warmup_steps: 0.25

      subset_strategy: random
      wandb_project: magic
