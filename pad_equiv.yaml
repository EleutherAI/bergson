# Tiny per-token MAGIC run whose dataset does not divide the batch size, so the
# padding path runs: doc_ids present, 2D weights, a synthetic pad document.
steps:
  - magic:
      run_path: /tmp/claude-1000/-mnt-ssd-1-lucia-bergson-damping/cc0b6db3-bc81-4869-99e5-b7615320d36a/scratchpad/padrun_wt-pad
      model: EleutherAI/pythia-14m
      overwrite: true
      batch_size: 8
      num_epochs: 1
      attribute_tokens: true
      skip_validation: true
      cleanup_ckpts: true
      distributed:
        nproc_per_node: 2
        nnode: 1
      data:
        dataset: NeelNanda/pile-10k
        split: "train[:6]"
        chunk_length: 512
      query:
        dataset: NeelNanda/pile-10k
        split: "train[:8]"
        truncation: true
        aggregation: mean
